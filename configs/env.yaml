# RescueDroneGym environment settings (all values are the defaults of EnvConfig)
control_dt: 0.1            # seconds of simulation per env.step (10 Hz policy)
physics_dt: 0.03333333333333333      # internal physics sub-step (1/30 s keeps training fast; Step 1 default is 1/60)
max_episode_steps: 1500    # truncation -> 150 s of simulated time
max_collisions: 30         # episode terminates (failure) after this many collision events
terminate_on_collision: false

# Action limits (action in [-1, 1] is scaled by these). null = the drone's own limit.
max_speed_xz: null         # m/s, lateral + forward
max_speed_y: null          # m/s, vertical
max_yaw_rate_deg: null     # deg/s

# Episode start
random_start: true         # random free position/yaw per episode (seeded by reset(seed=...))
start_altitude_range: [1.0, 1.4]

# Observation
n_rays: 12                 # horizontal proximity rays (+1 up, +1 down)
ray_range: 4.0             # m
n_fires_in_obs: 3          # nearest fires reported (zero padded)
thermal_grid: 6            # NxN body-aligned thermal heat grid
coverage_cell: 1.0         # m, coverage grid resolution
coverage_radius: 2.5       # m, a cell is "explored" if within this range with line of sight
room_discovery_fraction: 0.3   # fraction of a room's cells to explore before the room counts as discovered

# Navigation goal (global-planner hint; see docs/RL_INTERFACE.md)
goal_altitude: 1.2
goal_lookahead: 1.5        # m along the shortest path to the current target viewpoint
viewpoint_spacing: 3.5
goal_reach_radius: 1.0
planner_clearance_margin: 0.2
