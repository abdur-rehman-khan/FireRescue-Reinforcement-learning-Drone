# Small default: runs on a normal (even single-core) development computer in minutes.
# Do NOT expect a finished policy from this budget - check evaluate_agent.py before drawing conclusions.
seed: 0
total_timesteps: 30000
n_envs: 2
vec_env: dummy            # dummy | subproc
device: cpu
env_config: configs/env.yaml
reward_config: configs/reward.yaml
scenario: null            # optional JSON scenario (Step 1 format)

ppo:
  learning_rate: 0.0003
  n_steps: 512
  batch_size: 128
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.005
  vf_coef: 0.5
  max_grad_norm: 0.5
policy:
  net_arch: [128, 128]
  activation: tanh
  log_std_init: -1.0       # initial action noise std = exp(-1) = 0.37 (SB3 default 0 -> std 1 is huge for [-1,1] actions)

checkpoint_freq: 10000    # environment steps (total across envs)
eval_freq: 10000
eval_episodes: 5
eval_seed: 1000
